# SignalSync Nginx Production Reverse Proxy Configuration with HTTPS & WebSockets
# Authors: Atharav Arun Futane (2023BCS033) & Jitesh Sitaram Gaikwad (2023BCS083)

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Performance optimization: Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream FastAPI Uvicorn ASGI cluster
    upstream signalsync_backend {
        server signalsync-app:8000;
        server 127.0.0.1:8000 backup;
        keepalive 32;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name signalsync.local localhost;
        return 301 https://$host$request_uri;
    }

    # Production HTTPS Server
    server {
        listen 443 ssl http2;
        server_name signalsync.local localhost;

        # SSL / TLS configuration
        ssl_certificate /etc/nginx/ssl/signalsync.crt;
        ssl_certificate_key /etc/nginx/ssl/signalsync.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Hardened Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 64M;

        # Root static frontend serving
        location / {
            proxy_pass http://signalsync_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Proxy for /ws/traffic and /ws/video
        location /ws/ {
            proxy_pass http://signalsync_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # REST API Endpoints
        location /api/ {
            proxy_pass http://signalsync_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
